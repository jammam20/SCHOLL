name: school_parent
description: Parent mobile app for the School Bus System.
publish_to: none
environment:
  sdk: ^3.13.0
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0
  cloud_functions: ^6.3.4
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  intl: ^0.20.2
  school_shared:
    path: ../../packages/school_shared
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  firebase_database: ^12.4.7
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
