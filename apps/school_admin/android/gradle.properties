org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's relocatable incremental-compilation cache computes a relative
# path between the pub cache and the project directory — on Windows this
# throws ("this and base files have different roots") whenever the two
# live on different drive letters (e.g. pub cache on C:, project on D:).
# Disabling incremental compilation avoids that path computation entirely;
# the only cost is a slightly slower non-incremental Kotlin compile.
kotlin.incremental=false
