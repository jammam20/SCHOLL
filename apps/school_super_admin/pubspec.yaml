name: school_super_admin
description: Platform-owner control panel for the School Bus System — create schools and approve their first admin.
publish_to: none

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0

  flutter_bloc: ^9.1.1
  google_fonts: ^8.2.1
  firebase_crashlytics: ^5.3.0
  shared_preferences: ^2.5.5
  school_shared:
    path: ../../packages/school_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
