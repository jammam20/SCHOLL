name: school_bus_system_workspace
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - apps/school_admin
  - apps/school_driver
  - apps/school_parent
  - apps/school_super_admin
  - packages/school_shared
dev_dependencies:
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  melos: ^7.4.0
dependencies:
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  json_annotation: ^4.12.0
melos:
  scripts:
    get:
      run: melos exec -- "flutter pub get"
      description: Resolve dependencies for all Flutter packages.
    analyze:
      run: melos exec -- "flutter analyze"
      description: Analyze all Flutter packages.
